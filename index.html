<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чат с ИИ</title>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#faf9f5;--surface:#ffffff;--text:#1f1e1d;--muted:#6b6a66;--accent:#c96442;--accent-text:#ffffff;--user:#efe9de;--border:#e4e0d6;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#262624;--surface:#30302e;--text:#f1efe8;--muted:#a5a39b;--accent:#d97757;--accent-text:#1f1e1d;--user:#3a3935;--border:#44423e;color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#262624;--surface:#30302e;--text:#f1efe8;--muted:#a5a39b;--accent:#d97757;--accent-text:#1f1e1d;--user:#3a3935;--border:#44423e;color-scheme:dark;}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:17px;margin:0;font-weight:600}
header button{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:14px}
#log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;max-width:820px;width:100%;margin:0 auto;box-sizing:border-box}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.user{align-self:flex-end;background:var(--user)}
.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border)}
.err{color:#b3261e}
.hint{color:var(--muted);text-align:center;margin:auto;max-width:420px}
form,.bar{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--border);max-width:820px;width:100%;margin:0 auto;box-sizing:border-box}
textarea{flex:1;resize:none;max-height:160px;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;box-sizing:border-box}
#send{background:var(--accent);color:var(--accent-text);border:0;border-radius:12px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
#send:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<header><h1>Чат с ИИ</h1><button id="clear" type="button">Новый чат</button></header>
<div id="log"><div class="hint" id="hint">Задайте любой вопрос: про код, учёбу, текст, идеи — я отвечу.</div></div>
<div class="bar">
  <textarea id="inp" rows="1" placeholder="Напишите сообщение…"></textarea>
  <button id="send" type="button">Отправить</button>
</div>
<script>
(function(){
  var SYS = "Ты — умный, добрый и честный ИИ-ассистент. Отвечай на языке пользователя, по делу и понятно. Для кода используй простые блоки. Если не уверен — так и скажи.";
  var log = document.getElementById("log"), inp = document.getElementById("inp"),
      send = document.getElementById("send"), clearBtn = document.getElementById("clear");
  var history = [], sample = null, busy = false, ctrl = null;

  claude.use("sample").then(function(s){
    sample = s;
    if(!s){ add("bot","Эта страница работает только внутри claude.ai.", true); send.disabled = true; }
  }).catch(function(){ sample = null; });

  function add(role, text, isErr){
    var h = document.getElementById("hint"); if(h) h.remove();
    var d = document.createElement("div");
    d.className = "msg " + (role === "user" ? "user" : "bot") + (isErr ? " err" : "");
    d.textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
    return d;
  }

  async function ask(){
    var text = inp.value.trim();
    if(!text || busy || !sample) return;
    inp.value = ""; inp.style.height = "auto";
    add("user", text);
    history.push({role:"user", content:text});
    var msgs = history.map(function(m, i){
      return i === 0 ? {role:m.role, content: SYS + "\n\n" + m.content} : m;
    });
    var bubble = add("bot", "Думаю…");
    busy = true; send.disabled = true; ctrl = new AbortController();
    try{
      var res = await sample(msgs, {
        cache:false, signal:ctrl.signal, modelTier:"default",
        onText:function(t){ bubble.textContent = t.text; log.scrollTop = log.scrollHeight; }
      });
      bubble.textContent = res.text;
      history.push({role:"assistant", content:res.text});
    }catch(e){
      history.pop();
      bubble.classList.add("err");
      bubble.textContent = (e && e.code === "rate_limited") ? "Слишком много запросов, подождите немного." :
                           (e && e.code === "not_granted") ? "Доступ не разрешён." : "Ошибка. Попробуйте ещё раз.";
    }finally{
      busy = false; send.disabled = false; inp.focus();
    }
  }

  send.addEventListener("click", ask);
  inp.addEventListener("keydown", function(e){ if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask(); } });
  inp.addEventListener("input", function(){ inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight,160) + "px"; });
  clearBtn.addEventListener("click", function(){
    if(ctrl) ctrl.abort();
    history = []; log.innerHTML = '<div class="hint" id="hint">Задайте любой вопрос: про код, учёбу, текст, идеи — я отвечу.</div>';
  });
})();
</script>
</body>
</html>
